# AFM761 77GHz DDMA profile —— 第二板(迁移研究 docs/archive/afm761_integration_study.md F2)。
# 载入器:python/binding/config.py 的 load_profile();判据:与 mmwlab FrameReader
# 逐帧内存级对拍(python/bench/capture/ingest.py)。
#
# ⚠ step 红线与 sr61 完全同款:range_step/doppler_step 是波形第一性原理的派生量,
# 载入器用精确 c 从原始量独立推导并校验 stored≈derived 在 1% 内。stored 值为推导器
# 9 位输出(独立计算后手填),交叉参照:mmwlab 口径(c=3e8,fc=77e9)ΔR=1.3192、ΔV=0.075,
# 差 0.07% 全部来自 c 与 fc 修正——量级闭合。
# ⚠ 采集格式在 [ingest] 段(real int16 列主序,与 SR61 的 IMRE 复采样完全不同)。

[ingest]
# afm761 采集 .bin 格式(真值来源:afm761_modular reader.py 文档串,净室允许读理解):
#   小端 int16;每帧 [4 头 words][n_rx·n_adc·n_chirp payload words];
#   payload MATLAB 列主序 —— rx 最快,然后 range sample,然后 chirp 最慢。
#   头 4 words 无 magic/无 frameIdx 语义(参考实现直接跳过,不校验)。
format = "afm761"              # sr61 | afm761(缺省段=sr61)
rx_map = [3, 2, 1, 4]          # 1-based:文件槽位 rx_map[i] 承载逻辑 RX i(必须为排列)

[waveform]
modulation = "ddm"
num_tx = 4
num_rx = 4
num_adc_samples = 384
num_doppler_chirps = 128       # DDM: 每子带 doppler bin 数(= RdMap doppler 维)
num_chirps_per_frame = 768     # = num_subbands × num_doppler_chirps(DDM 不变量)
num_subbands = 6               # DDM 子带数;6 带中 4 带有 TX(带 4/5 空 ⇒ empty-band 搜索可用)

# 原始波形物理量(来源:mmwlab profiles/afm761.toml [rf];设备事实)
# ⚠ adc_start 参考侧未声明,填 0:对 ΔR 无影响,对 fc 修正 +56.9MHz(+0.0074%),
#   远小于 1% step 校验容差。
start_freq_ghz = 77.0
freq_slope_mhz_per_us = 8.883   # = 8.883e12 Hz/s(mmwlab [rf] slope_hz_per_s;⚠ MHz/µs↔Hz/s 换算恰是 1e12,
                               #  写错 1000× 会被 step 红线当场拒载 —— 已实测)
sample_rate_msps = 30.0
idle_time_us = 5.0
ramp_end_time_us = 28.81
adc_start_time_us = 0.0

# bin→物理标度(波形派生;载入器校验)
#   ΔR = c/(2·slope·Nadc/fs) = c/(2×8.883e12×12.8µs)
#   ΔV = c/(2·fc·768·T_chirp), fc=77.05685GHz(含采样窗中心修正), T_chirp=33.81µs
#   v 全展开 = ΔV·768/2 = ±28.77 m/s(DDM 无 TDM 的 numTx 折叠)
range_step = 1.318320713       # m/bin
doppler_step = 0.074915737     # (m/s)/bin
frame_period_ms = 100.0        # 板端帧周期(实测):100 帧/文件、文件名时间戳精确 10s 间隔
#   ⇒ 10 Hz。⚠ 不是 768×33.81µs=25.966ms —— 那只是"chirp 紧接"的最短帧时,
#   漏算了帧间 idle(radar_specification.md §145 早已标注)。两路独立证据:
#   ① 文件大小 235930400B = 严格 100 帧(2359304B/帧)且时间戳间隔 10s;
#   ② 行人位置运动(1.1–1.7 m/s)与多普勒测量自洽(用 25.966ms 会差 3.85×)。
#   F7 实测:eChainInit 按此派生 TrackCfg.xDeltaT(EKF 时间尺度)。

[calib]
# 实测标定量。afm761 未做角反射器距离标定,0 = 不补偿。
range_bias_m = 0.0

[mount]
elev_tilt_deg = 0.0
height_m = 0.0

# 跟踪参数 F7 行人重标定时再开;此处整段省略 = 全 core 默认(vChainTrackDefaults)。

[cluster]
mode = "off"
epsilon_m = 1.5
weight_z = 0.0
weight_vel = 4.0
min_points = 2

[range]
window = "hann"                # ⚠ F5 对齐项:参考侧窗型尚未核对,占位 SR61 同款

# DC 耦合签名去除:占位参数(enabled=false 不生效)。DDM 下 TX 分组数=1(全部 TX 同发),
# avg_chirps 的语义与 SR61(TDM 每 TX 分组)不同,F3/F5 实测后再调。
[range.dc_signature]
enabled = false
num_pos_bins = 8
num_neg_bins = 8
num_avg_chirps = 64

[doppler]
window = "hann"                # ⚠ F5 对齐项:占位

# CFAR:数值来自 afm761_modular config.py 的实测参数(range CASO w8/g4 8dB ×
# doppler CASO w4/g2 10dB,设备事实非算法移植)。⚠ 边界/循环语义差异 F5 复核。
[cfar]
peak_group_scheme = "det_matrix"
min_range_bin = 0
# ⛔ 镜像截断:AFM761 是 real 采样,range FFT 只有 192 个正频率 bin 有物理意义。
# 复 FFT 的 192..383 是 Hermitian 镜像区,CFAR 会把镜像也检成目标(实测占帧 0 检出
# 的 49%)。max_range_bin = 191 保证镜像区永不出点。
max_range_bin = 191
range_skip_low = 0
# skip_high = 192:镜像区**连训练单元都不当**(F5)——参考流的 rfft 语义是数组只有
# 192 行,range CFAR 的参考窗在 191 处物理截断;若不 skip,bin≤191 目标右侧的窗会
# 探进镜像区把噪声估计污染掉。
range_skip_high = 192
sub_bin_interp = false
# 十字分组:参考流(afm761 legacy)的峰值分组是 range/doppler 两轴各自独立做一维
# 局部极大后取交集(十字 4 邻),不是 3×3 方核——方核对角 veto 会把 RD 峰扩散块的
# 轴上次峰也压掉,点数差约 30%(实测 24 vs 15)。配合下方两维 peak_grouping = true。
cross_peak_grouping = false

[cfar.range]
average_mode = "caso"
threshold_db = 8.0
guard_len = 4
win_len = 8
os_rank = 12                   # 仅 os 模式用;caso 下无效
peak_grouping = false
# 平均域:log2(RdMap 单元算术平均)= 功率域几何平均,门限等效偏低 ~2.4dB,虚警偏多
# (实测点数 ×1.3);power = 功率域算术平均,与参考流 LINEAR 乘性门限同一语义。
average_domain = "power"

[cfar.doppler]
average_mode = "caso"
threshold_db = 10.0
guard_len = 2
win_len = 4
os_rank = 6
peak_grouping = false
average_domain = "power"

[doa]
# 变体名 dbf2d = "必须按 [doa.scan] 给的网格扫描"(全网格复加权)。afm761 是 16/175
# 稀疏 3-z 阵:beam 的角度 FFT 路径摆不了格(z=−3 越界 lround 到 uint32,修前实测
# SIGSEGV),music 慢且对宽波束无增益;route.c 对本阵也推 dbf2d —— 显式写出来,行为
# 不靠 auto 猜。网格见 [doa.scan] 段。
# (2026-09-12 起 dbf2d 与 beam 是同一估计器的两种求值后端:配了网格就走直接加权扫描。
#  变体名保留是因为它的语义更严 —— beam 不配网格也合法,而 dbf2d 必须配。)
variant = "dbf2d"
# 扩展最大速度是 TDM 折叠机制的解药;DDM doppler 本就全展开(±28.77),机制不适用。
extended_max_velocity = false
angle_interp = false

[doa.fov]
enabled = false
az_min_deg = -60.0
az_max_deg = 60.0
el_min_deg = -30.0
el_max_deg = 30.0

[doa.multi_peak]
enabled = false
threshold_scale = 0.5

[doa.scan]
# 角度扫描网格(度,闭区间含端点),来源:mmwlab afm761 profile 的 az_scan/el_scan
# (净室只取参数值;算法本体是 C core 净室写的直接加权扫描,不是参考实现代码)。
# 段名 2026-09-12 前叫 [doa.dbf2d],旧名仍接受(load_profile 兼容),两个同时给出会报错。
# 141×121=17061 格 ≤ 容量上限 32768。超出网格的目标被拉向网格边缘 —— 部署方
# 负责把网格盖住视场;FOV 段可作网格内的二次裁剪(估角后逐点拒)。
az_start_deg = -70.0
az_stop_deg = 70.0
az_step_deg = 1.0
el_start_deg = -30.0
el_stop_deg = 30.0
el_step_deg = 0.5

[track]
# F7 行人场景重标定:**只改 range 量测噪声一项**(xMeasNoise[0])。
#
# 推导(bin 量化,第一性原理):本 profile 的 sub_bin_interp=false ⇒ range 是纯
# bin 量化,量化误差 ~ U(±ΔR/2),方差 = ΔR²/12 = 1.318320713²/12 = 0.144831
# (σ = 0.381 m)。core 默认 0.020(σ = 0.14 m)对 SR61 是合理的保守估计
# (SR61 ΔR = 0.183 m ⇒ 量化方差 0.0028,默认值保守 7.2×),但两板 ΔR 差 7.2×
# 之后同一个默认值对 afm761 反过来成了"过度自信"。
#
# 后果链(实测,楼下行走采集 1000 帧):range 残差被低估的 R 放大成偏马氏距离,
# 关联门(χ²(3),G=9)在第 17 帧起持续拒收真点 → 轨死/重起 → 位置只能靠预测
# 外推 → EKF 速度被位置量化跳变带飞(3.90 m/s 假速度,真实 1.3–1.6)。
# 改后:行人轨 6 帧 → 144 帧连续,速度 p50 1.6–2.0 m/s(步行包络内)。
#
# 消融(同采集,只动单项):r 单项即复现全部改善;az/el/dop 单项无可测效果;
# max_accel/gate_gain/alloc_points 的对照见 docs/archive/afm761_integration_study.md §10。
meas_noise_r = 0.144831

[array]
file = "afm761_array.csv"      # 相对本 profile 目录
grid_rows = 5                  # z 半λ 网格 −1..3 共 5 行(网格注记;直接加权扫描不消费)
grid_cols = 35                 # x 半λ 网格 0..34 共 35 列(同上)
